name: Build xgboost wheel (Android arm64-v8a / Python 3.11) v10c - xgboost 1.7.6
# ============================================================
# v10c 修复（基于 v10 实际失败日志）：
#   问题1：v10 的 dry-run 校验用了 GitHub 源码包 + 错误目录结构，
#          而 Chaquopy 实际编译用的是 PyPI sdist（两者结构不同）
#   问题2：heredoc + sed 去缩进写补丁的方式在 YAML 块中容易错位
#   修复：
#   1. 补丁完全重写：以 PyPI sdist（xgboost-1.7.6.tar.gz）真实内容为基准，
#      5 个 hunk 全部通过逐行精确匹配验证 + 补丁后 Python 语法校验
#      （setup.py: @@158/@@360, libpath.py: @@52, cpu_predictor.cc: @@169/@@209）
#   2. 补丁以 base64 内嵌，运行时解码写入，彻底避免缩进/转义问题
#   3. dry-run 校验改为下载 PyPI sdist，在 sdist 根目录执行 patch -p1，
#      与 build-wheel.py 的真实打补丁环境完全一致
#   4. 版本固定为 1.7.6（补丁按 1.7.6 sdist 精确定制）
#
# 产物：Artifacts → xgboost-android-arm64-v8a-cp311
# ============================================================
on:
  workflow_dispatch:
    inputs:
      chaquopy_ref:
        description: 'chaquo/chaquopy 的分支或 tag（默认 master）'
        required: false
        default: 'master'
      target_version:
        description: 'Chaquopy Python target 版本（默认 3.11.17-0）'
        required: false
        default: '3.11.17-0'
concurrency:
  group: build-xgboost-android
  cancel-in-progress: true
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  XGB_VER: "1.7.6"
jobs:
  build:
    name: xgboost 1.7.6 → android_24_arm64_v8a (cp311)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      # ---------- 1. 拉取 Chaquopy 构建系统 ----------
      - name: Checkout Chaquopy source
        uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: ${{ inputs.chaquopy_ref || 'master' }}
          path: chaquopy
          fetch-depth: 1
      # ---------- 2. 补丁：ln -s → ln -sf（新版 target 自带 libpython3.so） ----------
      - name: Patch build-wheel.py (ln -s → ln -sf)
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi"
          echo "=== 补丁前 ==="
          grep -n "ln -s " build-wheel.py || true
          sed -i 's/ln -s /ln -sf /' build-wheel.py
          echo "=== 补丁后 ==="
          grep -n "ln -sf " build-wheel.py
      # ---------- 3. 改写 xgboost 配方版本号为 1.7.6 ----------
      - name: Set xgboost recipe version to 1.7.6
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi/packages/xgboost"
          echo "=== 原始 meta.yaml ==="
          cat meta.yaml
          sed -i -E 's/^(\s*version:\s*).*/\1"1.7.6"/' meta.yaml
          if grep -qE '^\s*number:' meta.yaml; then
            sed -i -E 's/^(\s*number:\s*)[0-9]+/\11/' meta.yaml
          else
            printf '\nbuild:\n  number: 1\n' >> meta.yaml
          fi
          echo "=== 改写后 meta.yaml ==="
          cat meta.yaml
      # ---------- 4. 写入针对 PyPI sdist 1.7.6 精确定制的新补丁（base64 解码） ----------
      - name: Write chaquopy.patch tailored for PyPI sdist 1.7.6
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi/packages/xgboost"
          python3 -c "import base64; open('patches/chaquopy.patch','wb').write(base64.b64decode(''))"
          echo "=== 新补丁 hunk headers ==="
          grep -n "^@@" patches/chaquopy.patch
          echo "=== 补丁行数 ==="
          wc -l patches/chaquopy.patch
      # ---------- 5. 用 PyPI sdist 做 dry-run 校验（与真实构建同源） ----------
      - name: Verify patch against PyPI sdist (dry-run)
        run: |
          set -e
          cd /tmp
          rm -rf xgb-verify && mkdir xgb-verify && cd xgb-verify
          echo "=== 获取 PyPI sdist 下载地址 ==="
          SDIST_URL=$(curl -fsSL "https://pypi.org/pypi/xgboost/${XGB_VER}/json" \
            | python3 -c "import sys,json; print([f['url'] for f in json.load(sys.stdin)['urls'] if f['packagetype']=='sdist'][0])")
          echo "sdist: $SDIST_URL"
          curl -fSL --retry 3 -o sdist.tar.gz "$SDIST_URL"
          tar xzf sdist.tar.gz
          cd xgboost-${XGB_VER}
          echo "=== sdist 根目录 ==="
          ls | head -20
          echo "=== 应用补丁（--dry-run，与 build-wheel.py 同为 -p1）==="
          patch -p1 --dry-run --fuzz=3 < "$GITHUB_WORKSPACE/chaquopy/server/pypi/packages/xgboost/patches/chaquopy.patch" \
            && echo "✅ PATCH DRY-RUN OK" \
            || { echo "❌ PATCH DRY-RUN FAILED"; exit 1; }
      # ---------- 6. 下载 Python target 运行时 ----------
      - name: Download Python target from Maven Central
        env:
          TV: ${{ inputs.target_version || '3.11.17-0' }}
        run: |
          DEST="$GITHUB_WORKSPACE/chaquopy/maven/com/chaquo/python/target/$TV"
          mkdir -p "$DEST"
          URL="https://repo1.maven.org/maven2/com/chaquo/python/target/$TV/target-$TV-arm64-v8a.zip"
          echo "下载: $URL"
          curl -fSL --retry 3 -o "$DEST/target-$TV-arm64-v8a.zip" "$URL"
          ls -lh "$DEST"
      # ---------- 7. 环境确认 ----------
      - name: Check environment
        run: |
          python3 --version
          ls "$ANDROID_HOME/ndk"
      # ---------- 8. 选定 NDK ----------
      - name: Pick NDK version
        id: ndk
        run: |
          LATEST=$(ls -v "$ANDROID_HOME/ndk" 2>/dev/null | tail -n1)
          echo "ndk=$ANDROID_HOME/ndk/$LATEST" >> "$GITHUB_OUTPUT"
          echo "使用 NDK: $LATEST"
      # ---------- 9. 基础依赖 ----------
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache build-essential patch
      # ---------- 10. JDK 17 ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ---------- 11. Python 3.11 ----------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ---------- 12. build-wheel.py 依赖 ----------
      - name: Install build-wheel requirements
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi"
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install build pyelftools jinja2 jsonschema pypi_simple pyyaml
          python3 -c "import build, elftools, jinja2, jsonschema, pypi_simple, yaml; print('依赖 OK')"
      # ---------- 13. 交叉编译 xgboost ----------
      - name: Build xgboost wheel (arm64-v8a, py3.11)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi"
          python3 build-wheel.py --abi arm64-v8a --python 3.11 xgboost 2>&1 | tee /tmp/build.log
      # ---------- 14. 失败时 dump 日志 ----------
      - name: Dump build log tail on failure
        if: failure()
        run: |
          echo "=== 构建日志最后 150 行 ==="
          tail -n 150 /tmp/build.log || true
          echo "=== 全部 whl 产物 ==="
          find "$GITHUB_WORKSPACE/chaquopy" -name "*.whl" | head -40 || true
      # ---------- 15. 收集 wheel ----------
      - name: Collect target wheel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          WH=$(find "$GITHUB_WORKSPACE/chaquopy" -name "xgboost-*cp311-cp311-android_24_arm64_v8a.whl" 2>/dev/null | head -n1)
          if [ -z "$WH" ]; then
            echo "未找到 cp311/arm64-v8a wheel，全部 whl 产物："
            find "$GITHUB_WORKSPACE/chaquopy" -name "*.whl" | head -40 || true
            exit 1
          fi
          cp -v "$WH" "$GITHUB_WORKSPACE/wheelhouse/"
          ls -lh "$GITHUB_WORKSPACE/wheelhouse"
      # ---------- 16. 上传产物 ----------
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-android-arm64-v8a-cp311
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # ---------- 17. 构建摘要 ----------
      - name: Build summary
        if: always()
        run: |
          {
            echo "### xgboost Android wheel 构建摘要（v10c / xgboost 1.7.6）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 源码仓库 | chaquo/chaquopy@${{ inputs.chaquopy_ref || 'master' }} |"
            echo "| 构建入口 | server/pypi/build-wheel.py（已打 ln -sf 补丁）|"
            echo "| 配方 | packages/xgboost（1.7.6，PyPI sdist）|"
            echo "| 补丁 | chaquopy.patch（按 1.7.6 sdist 精确定制，base64 内嵌）|"
            echo "| Python target | ${{ inputs.target_version || '3.11.17-0' }}（Maven Central）|"
            echo "| 目标平台 | android_24_arm64_v8a |"
          } >> "$GITHUB_STEP_SUMMARY"
