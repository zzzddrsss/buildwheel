name: Build xgboost wheel (Android arm64-v8a / Python 3.11)
# ============================================================
# 用途：用 Chaquopy 官方交叉编译环境（chaquopy/ci-public Docker 镜像，
#      内置 Android NDK/SDK + 工具链），把 xgboost 源码编译成 Android wheel：
#        xgboost-x.x.x-cp311-cp311-android_24_arm64_v8a.whl
#
# 产物：Actions 运行完成后，在本页 Artifacts 下载
#      xgboost-android-arm64-v8a-cp311
#
# 拿到 wheel 后：
#   1. 放到仓库 android/app/wheels/ 目录
#   2. build.gradle 的 pip 块加一行：
#        install "wheels/<wheel文件名>"
#   3. （可选）scikit-learn 不用编！直接加：install "scikit-learn"
#      （Chaquopy 官方仓库已有现成 Android wheel，自动下载）
#
# 注意：
#   - xgboost 是大型 C++ 项目，完整构建（多 Python 版本 × 多 ABI）
#     可能需要 1~3 小时，timeout 已设为 350 分钟
#   - 如果构建失败，把 Actions 日志末尾 100 行发给章鱼妹分析
#   - 镜像/命令参考 Chaquopy 官方文档：
#     https://chaquo.com/chaquopy/doc/current/technical.html
# ============================================================
on:
  workflow_dispatch:
    inputs:
      xgboost_version:
        description: 'xgboost 版本（留空=最新，如 2.1.4）'
        required: false
        default: ''
      chaquopy_branch:
        description: 'Chaquopy 源码分支（与 App 插件大版本一致，默认 15.0）'
        required: false
        default: '15.0'
# 同一时间只保留最新一次构建
concurrency:
  group: build-xgboost-android
  cancel-in-progress: true
# 最小权限原则
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
jobs:
  build:
    name: xgboost → android_24_arm64_v8a (cp311)
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    # Chaquopy 官方构建镜像：已装好 Android NDK/SDK、交叉编译 clang、
    # 以及为 Android 预编译的依赖库（与官方 numpy/pandas wheel 同源）
    container:
      image: chaquopy/ci-public:latest
      options: --user root
    steps:
      # ---------- 1. 环境确认 ----------
      - name: Show toolchain versions
        run: |
          python --version
          git --version || (apt-get update && apt-get install -y git)
      # ---------- 2. 拉取 Chaquopy 构建脚本 ----------
      # 分支要与 App 使用的 Chaquopy 插件大版本一致（默认 15.0）
      - name: Clone Chaquopy source
        run: |
          git clone --depth 1 \
            --branch "${{ inputs.chaquopy_branch || '15.0' }}" \
            https://github.com/chaquopy/chaquopy.git /opt/chaquopy
          cd /opt/chaquopy && git log -1 --oneline
      # ---------- 3. 交叉编译 xgboost ----------
      # build.py 会：下载 PyPI 源码 → 应用 Android 补丁 → 用 NDK 工具链
      # 为所有支持的 Python 版本 × ABI 编译 wheel → 输出到 server/pip/wheelhouse
      - name: Build xgboost wheel (cross-compile)
        run: |
          cd /opt/chaquopy/server/pip
          VER="${{ inputs.xgboost_version }}"
          if [ -n "$VER" ]; then
            SPEC="xgboost==${VER}"
          else
            SPEC="xgboost"
          fi
          echo "构建目标: ${SPEC}"
          python build.py "${SPEC}"
      # ---------- 4. 挑出目标 wheel（cp311 / arm64-v8a）----------
      - name: Collect target wheel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          WH=$(ls /opt/chaquopy/server/pip/wheelhouse/xgboost-*cp311-cp311-android_24_arm64_v8a.whl 2>/dev/null | head -n1)
          if [ -z "$WH" ]; then
            echo "未找到 cp311/arm64-v8a 的 wheel！全部产物如下："
            ls -lh /opt/chaquopy/server/pip/wheelhouse 2>/dev/null || true
            exit 1
          fi
          cp -v "$WH" "$GITHUB_WORKSPACE/wheelhouse/"
          echo "目标 wheel:"
          ls -lh "$GITHUB_WORKSPACE/wheelhouse"
      # ---------- 5. 上传产物 ----------
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-android-arm64-v8a-cp311
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0   # whl 本身已压缩
      # ---------- 6. 构建摘要 ----------
      - name: Build summary
        if: always()
        run: |
          {
            echo "### xgboost Android wheel 构建摘要"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 目标平台 | android_24_arm64_v8a |"
            echo "| Python | 3.11 (cp311) |"
            echo "| xgboost | ${{ inputs.xgboost_version || 'latest' }} |"
            echo ""
            echo "**全部产物：**"
            echo '```'
            ls -lh /opt/chaquopy/server/pip/wheelhouse 2>/dev/null || echo "无产物"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
