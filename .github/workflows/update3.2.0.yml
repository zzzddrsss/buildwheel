name: Build xgboost wheel (Android arm64-v8a / Python 3.11) v11 - xgboost 3.2.0
# ============================================================
# v11 激进升级：xgboost 1.7.3 → 3.2.0（Python 3.11 能用的最高版本）
#
# 重大变化：2.0.0 起官方构建系统从 setup.py 迁移到
#          pyproject.toml + hatchling + packager/pep517.py
#          → 原 chaquopy.patch（改 setup.py）完全失效，必须重写
#
# 本 workflow 的做法：
#   1. 从 GitHub 拉取 xgboost v3.2.0 源码
#   2. 用 CMake 交叉编译 libxgboost.so（NDK 工具链）
#   3. 手工组装 wheel：xgboost/ 包 + lib/libxgboost.so
#   4. 打补丁改 libpath.py（Chaquopy 需要按需解压 .so）
#
# 注意：这条路风险较高，若失败建议退回 v10（1.7.6）
# ============================================================
on:
  workflow_dispatch:
    inputs:
      xgboost_version:
        description: 'XGBoost 版本（默认 3.2.0）'
        required: false
        default: '3.2.0'
      target_version:
        description: 'Chaquopy Python target 版本（默认 3.11.17-0）'
        required: false
        default: '3.11.17-0'
concurrency:
  group: build-xgboost-android-v11
  cancel-in-progress: true
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  XGB_VER: ${{ inputs.xgboost_version || '3.2.0' }}
  ABI: arm64-v8a
  API_LEVEL: "24"
  PY_VER: "3.11"
jobs:
  build:
    name: xgboost ${{ inputs.xgboost_version || '3.2.0' }} → android_24_arm64_v8a (cp311)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      # ---------- 1. 拉取 Chaquopy（要它的 wheel 打包辅助） ----------
      - name: Checkout Chaquopy source
        uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: master
          path: chaquopy
          fetch-depth: 1
      # ---------- 2. 拉取 xgboost 源码 ----------
      - name: Checkout xgboost source
        uses: actions/checkout@v4
        with:
          repository: dmlc/xgboost
          ref: v${{ inputs.xgboost_version || '3.2.0' }}
          path: xgboost-src
          fetch-depth: 1
          submodules: recursive
      # ---------- 3. 下载 Python target 运行时 ----------
      - name: Download Python target
        env:
          TV: ${{ inputs.target_version || '3.11.17-0' }}
        run: |
          DEST="$GITHUB_WORKSPACE/pytarget"
          mkdir -p "$DEST"
          URL="https://repo1.maven.org/maven2/com/chaquo/python/target/$TV/target-$TV-arm64-v8a.zip"
          echo "下载: $URL"
          curl -fSL --retry 3 -o "$DEST/target.zip" "$URL"
          cd "$DEST" && unzip -q target.zip && ls -la
      # ---------- 4. 环境确认 + NDK ----------
      - name: Check environment
        run: |
          python3 --version
          ls "$ANDROID_HOME/ndk"
      - name: Pick NDK version
        id: ndk
        run: |
          LATEST=$(ls -v "$ANDROID_HOME/ndk" 2>/dev/null | tail -n1)
          echo "ndk=$ANDROID_HOME/ndk/$LATEST" >> "$GITHUB_OUTPUT"
          echo "使用 NDK: $LATEST"
      # ---------- 5. 基础依赖 ----------
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache build-essential cmake ninja-build patch unzip
      # ---------- 6. Python 3.11 ----------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install python build deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel setuptools
      # ---------- 7. 交叉编译 libxgboost.so ----------
      - name: Cross-compile libxgboost.so
        env:
          NDK: ${{ steps.ndk.outputs.ndk }}
        run: |
          set -e
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="$TC/bin/aarch64-linux-android${API_LEVEL}-clang"
          export CXX="$TC/bin/aarch64-linux-android${API_LEVEL}-clang++"
          export AR="$TC/bin/llvm-ar"
          export RANLIB="$TC/bin/llvm-ranlib"
          export STRIP="$TC/bin/llvm-strip"
          echo "CC=$CC"
          $CC --version
          cd "$GITHUB_WORKSPACE/xgboost-src"
          rm -rf build && mkdir -p build && cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM="android-${API_LEVEL}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOOGLE_TEST=OFF \
            -DUSE_CUDA=OFF \
            -DUSE_NCCL=OFF \
            -DUSE_OPENMP=OFF \
            -DUSE_R=OFF \
            -DJVM_BINDINGS=OFF \
            -DXGBOOST_BUILD_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/xgb-install"
          ninja -j"$(nproc)" 2>&1 | tail -50
          cmake --install . 2>&1 | tail -20
          echo "=== 产物 ==="
          find "$GITHUB_WORKSPACE/xgb-install" -name "*.so" -o -name "*.a" | head -20
      # ---------- 8. 组装 wheel ----------
      - name: Assemble wheel
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf wheelbuild && mkdir -p wheelbuild
          cd wheelbuild
          # 复制 python 包
          cp -r "$GITHUB_WORKSPACE/xgboost-src/python-package/xgboost" .
          # 复制 .so 到 xgboost/lib/
          mkdir -p xgboost/lib
          find "$GITHUB_WORKSPACE/xgb-install" -name "libxgboost.so" -exec cp -v {} xgboost/lib/ \;
          # 打补丁：libpath.py 不检查文件存在（Chaquopy 按需解压）
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("xgboost/libpath.py")
          src = p.read_text(encoding="utf-8")
          old = 'lib_path = [p for p in dll_path if os.path.exists(p) and os.path.isfile(p)]'
          new = 'lib_path = dll_path  # Chaquopy: skip existence check, .so is extracted on demand'
          if old in src:
              src = src.replace(old, new)
              print("libpath.py 补丁已应用")
          else:
              print("警告：未找到目标行，libpath.py 未修改")
              for line in src.splitlines():
                  if "lib_path" in line:
                      print("  ", line)
          p.write_text(src, encoding="utf-8")
          PYEOF
          # 写 VERSION
          echo "$XGB_VER" > xgboost/VERSION
          # 生成 setup.py（最小化，只打包，不编译）
          cat > setup.py <<'PYEOF'
          from setuptools import setup, find_packages
          import os
          VERSION = open("xgboost/VERSION").read().strip()
          setup(
              name="xgboost",
              version=VERSION,
              description="XGBoost Python Package (Android/Chaquopy build)",
              packages=find_packages(),
              package_data={"xgboost": ["VERSION", "lib/*.so"]},
              include_package_data=True,
              zip_safe=False,
              license="Apache-2.0",
          )
          PYEOF
          ls -la
          ls -la xgboost/lib/
          # 构建 wheel
          python3 setup.py bdist_wheel
          echo "=== wheel 产物 ==="
          ls -lh dist/
      # ---------- 9. 重命名 wheel 为 Android ABI 标签 ----------
      - name: Retag wheel for Android
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/wheelbuild/dist"
          WH=$(ls *.whl | head -n1)
          echo "原始: $WH"
          # 用 wheel tags 工具重打标签
          python3 -m pip install wheel
          python3 -m wheel tags --python-tag cp311 --abi-tag cp311 --platform-tag android_24_arm64_v8a \
            --remove "$WH" || true
          echo "=== 重打标签后 ==="
          ls -lh
      # ---------- 10. 收集 ----------
      - name: Collect wheel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          cp -v "$GITHUB_WORKSPACE/wheelbuild/dist/"*.whl "$GITHUB_WORKSPACE/wheelhouse/"
          ls -lh "$GITHUB_WORKSPACE/wheelhouse"
      # ---------- 11. 上传 ----------
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-android-arm64-v8a-cp311-v11
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # ---------- 12. 摘要 ----------
      - name: Build summary
        if: always()
        run: |
          {
            echo "### xgboost Android wheel 构建摘要（v11 / xgboost ${XGB_VER}）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| xgboost 源码 | dmlc/xgboost@v${XGB_VER} |"
            echo "| 构建方式 | CMake 交叉编译 + 手工组装 wheel |"
            echo "| Python target | ${{ inputs.target_version || '3.11.17-0' }} |"
            echo "| 目标平台 | android_24_arm64_v8a |"
          } >> "$GITHUB_STEP_SUMMARY"
