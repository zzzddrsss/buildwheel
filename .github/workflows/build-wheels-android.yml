name: Build xgboost wheel (Android arm64-v8a / Python 3.11) v9
# ============================================================
# v9 修复：新版 Python target 包（3.11.17）自带 libpython3.so，
#          而 build-wheel.py L497 用 `ln -s`（无 -f）建同名链接时报
#          "failed to create symbolic link ... File exists"。
#          → 构建前用 sed 把 build-wheel.py 的 `ln -s ` 改为 `ln -sf `。
# 前情：v8 已打通（源码下载/补丁/target 解压全部成功，仅卡在此处）。
#
# 产物：Artifacts → xgboost-android-arm64-v8a-cp311
# 拿到 wheel 后：放 android/app/wheels/ + build.gradle 加 install "wheels/<文件名>"
# 失败请把日志最后 100 行发给章鱼妹
# ============================================================
on:
  workflow_dispatch:
    inputs:
      chaquopy_ref:
        description: 'chaquo/chaquopy 的分支或 tag（默认 master）'
        required: false
        default: 'master'
      target_version:
        description: 'Chaquopy Python target 版本（默认 3.11.17-0）'
        required: false
        default: '3.11.17-0'
concurrency:
  group: build-xgboost-android
  cancel-in-progress: true
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
jobs:
  build:
    name: xgboost 1.7.3 → android_24_arm64_v8a (cp311)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      # ---------- 1. 拉取 Chaquopy 构建系统 ----------
      - name: Checkout Chaquopy source
        uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: ${{ inputs.chaquopy_ref || 'master' }}
          path: chaquopy
          fetch-depth: 1
      # ---------- 2. 补丁：ln -s → ln -sf（新版 target 自带 libpython3.so） ----------
      - name: Patch build-wheel.py (ln -s → ln -sf)
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi"
          grep -n "ln -s " build-wheel.py || true
          sed -i 's/ln -s /ln -sf /' build-wheel.py
          echo "补丁后："
          grep -n "ln -sf " build-wheel.py
      # ---------- 3. 下载 Python target 运行时 ----------
      - name: Download Python target from Maven Central
        env:
          TV: ${{ inputs.target_version || '3.11.17-0' }}
        run: |
          DEST="$GITHUB_WORKSPACE/chaquopy/maven/com/chaquo/python/target/$TV"
          mkdir -p "$DEST"
          URL="https://repo1.maven.org/maven2/com/chaquo/python/target/$TV/target-$TV-arm64-v8a.zip"
          echo "下载: $URL"
          curl -fSL --retry 3 -o "$DEST/target-$TV-arm64-v8a.zip" "$URL"
          ls -lh "$DEST"
      # ---------- 4. 环境确认 ----------
      - name: Check environment
        run: |
          python3 --version
          ls "$ANDROID_HOME/ndk"
      # ---------- 5. 选定 NDK ----------
      - name: Pick NDK version
        id: ndk
        run: |
          LATEST=$(ls -v "$ANDROID_HOME/ndk" 2>/dev/null | tail -n1)
          echo "ndk=$ANDROID_HOME/ndk/$LATEST" >> "$GITHUB_OUTPUT"
          echo "使用 NDK: $LATEST"
      # ---------- 6. 基础依赖 ----------
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache build-essential
      # ---------- 7. JDK 17 ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ---------- 8. Python 3.11 ----------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ---------- 9. build-wheel.py 依赖 ----------
      - name: Install build-wheel requirements
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi"
          python3 -m pip install -r requirements.txt
          python3 -c "import build, elftools, jinja2, jsonschema, pypi_simple, yaml; print('依赖 OK')"
      # ---------- 10. 交叉编译 xgboost 1.7.3 ----------
      - name: Build xgboost wheel (arm64-v8a, py3.11)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi"
          python3 build-wheel.py --abi arm64-v8a --python 3.11 xgboost
      # ---------- 11. 收集 wheel ----------
      - name: Collect target wheel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          WH=$(find "$GITHUB_WORKSPACE/chaquopy" -name "xgboost-*cp311-cp311-android_24_arm64_v8a.whl" 2>/dev/null | head -n1)
          if [ -z "$WH" ]; then
            echo "未找到 cp311/arm64-v8a wheel，全部 whl 产物："
            find "$GITHUB_WORKSPACE/chaquopy" -name "*.whl" | head -40 || true
            exit 1
          fi
          cp -v "$WH" "$GITHUB_WORKSPACE/wheelhouse/"
          ls -lh "$GITHUB_WORKSPACE/wheelhouse"
      # ---------- 12. 上传产物 ----------
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-android-arm64-v8a-cp311
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # ---------- 13. 构建摘要 ----------
      - name: Build summary
        if: always()
        run: |
          {
            echo "### xgboost Android wheel 构建摘要（v9 ln -sf 补丁版）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 源码仓库 | chaquo/chaquopy@master |"
            echo "| 构建入口 | server/pypi/build-wheel.py（已打 ln -sf 补丁）|"
            echo "| 配方 | packages/xgboost（1.7.3）|"
            echo "| Python target | ${{ inputs.target_version || '3.11.17-0' }}（Maven Central）|"
            echo "| 目标平台 | android_24_arm64_v8a |"
          } >> "$GITHUB_STEP_SUMMARY"
