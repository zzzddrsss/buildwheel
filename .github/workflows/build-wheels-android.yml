name: Build xgboost wheel (Android arm64-v8a / Python 3.11) v7
# ============================================================
# v7 修复：找到真正的构建入口 server/pypi/build-wheel.py（v6 的 find
#          抓到的是 gradle 测试脚本）。且官方仓库自带 xgboost 1.7.3 配方
#          （含 Android 补丁），直接使用。
#
# 用法（官方）：python build-wheel.py --abi arm64-v8a --python 3.11 xgboost
#
# 产物：Artifacts → xgboost-android-arm64-v8a-cp311
# 拿到 wheel 后：放 android/app/wheels/ + build.gradle 加 install "wheels/<文件名>"
# 失败请把日志最后 100 行发给章鱼妹
# ============================================================
on:
  workflow_dispatch:
    inputs:
      chaquopy_ref:
        description: 'chaquo/chaquopy 的分支或 tag（默认 master）'
        required: false
        default: 'master'
concurrency:
  group: build-xgboost-android
  cancel-in-progress: true
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
jobs:
  build:
    name: xgboost 1.7.3 → android_24_arm64_v8a (cp311)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      # ---------- 1. 拉取 Chaquopy 构建系统 ----------
      - name: Checkout Chaquopy source
        uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: ${{ inputs.chaquopy_ref || 'master' }}
          path: chaquopy
          fetch-depth: 1
      # ---------- 2. 环境确认 ----------
      - name: Check environment
        run: |
          python3 --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk"
      # ---------- 3. 选定 NDK ----------
      - name: Pick NDK version
        id: ndk
        run: |
          LATEST=$(ls -v "$ANDROID_HOME/ndk" 2>/dev/null | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "::error::runner 未预装 NDK"
            exit 1
          fi
          echo "ndk=$ANDROID_HOME/ndk/$LATEST" >> "$GITHUB_OUTPUT"
          echo "使用 NDK: $LATEST"
      # ---------- 4. 基础依赖 ----------
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache build-essential
      # ---------- 5. JDK 17（build-wheel.py 编译 Java 相关组件需要） ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ---------- 6. Python 3.11 ----------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ---------- 7. 安装 build-wheel.py 的依赖 ----------
      - name: Install build-wheel requirements
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi"
          python3 -m pip install -r requirements.txt
          python3 -c "import build, elftools, jinja2, jsonschema, pypi_simple, yaml; print('依赖 OK')"
      # ---------- 8. 用官方配方交叉编译 xgboost 1.7.3 ----------
      - name: Build xgboost wheel (arm64-v8a, py3.11)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy/server/pypi"
          python3 build-wheel.py --abi arm64-v8a --python 3.11 xgboost
      # ---------- 9. 收集 wheel（全仓搜索） ----------
      - name: Collect target wheel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          WH=$(find "$GITHUB_WORKSPACE/chaquopy" -name "xgboost-*cp311-cp311-android_24_arm64_v8a.whl" 2>/dev/null | head -n1)
          if [ -z "$WH" ]; then
            echo "未找到 cp311/arm64-v8a wheel，全部 whl 产物："
            find "$GITHUB_WORKSPACE/chaquopy" -name "*.whl" | head -40 || true
            exit 1
          fi
          cp -v "$WH" "$GITHUB_WORKSPACE/wheelhouse/"
          ls -lh "$GITHUB_WORKSPACE/wheelhouse"
      # ---------- 10. 上传产物 ----------
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-android-arm64-v8a-cp311
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # ---------- 11. 构建摘要 ----------
      - name: Build summary
        if: always()
        run: |
          {
            echo "### xgboost Android wheel 构建摘要（v7 官方入口版）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 源码仓库 | chaquo/chaquopy@master |"
            echo "| 构建入口 | server/pypi/build-wheel.py |"
            echo "| 配方 | packages/xgboost（1.7.3，含 Android 补丁）|"
            echo "| 目标平台 | android_24_arm64_v8a |"
            echo "| Python | 3.11 (cp311) |"
          } >> "$GITHUB_STEP_SUMMARY"
