name: Build xgboost wheel (Android arm64-v8a / Python 3.11) v5
# ============================================================
# v5 修复：仓库地址错误 → 正确地址是 chaquo/chaquopy（组织名 chaquo，无 y），
#          默认分支 master（无 15.0 分支）。已通过 GitHub API 实测验证 200 OK。
# 其余与 v4 相同：单目标 cp311 + arm64-v8a，约 20~40 分钟。
#
# 产物：Artifacts → xgboost-android-arm64-v8a-cp311
# 拿到 wheel 后：放 android/app/wheels/ + build.gradle 加 install "wheels/<文件名>"
# 失败请把日志最后 100 行发给章鱼妹
# ============================================================
on:
  workflow_dispatch:
    inputs:
      xgboost_version:
        description: 'xgboost 版本（留空=最新，如 2.1.4）'
        required: false
        default: ''
      chaquopy_ref:
        description: 'chaquo/chaquopy 的分支或 tag（默认 master）'
        required: false
        default: 'master'
concurrency:
  group: build-xgboost-android
  cancel-in-progress: true
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
jobs:
  build:
    name: xgboost → android_24_arm64_v8a (cp311 only)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      # ---------- 1. 拉取 Chaquopy 构建系统（正确地址：chaquo/chaquopy） ----------
      - name: Checkout Chaquopy source
        uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: ${{ inputs.chaquopy_ref || 'master' }}
          path: chaquopy
          fetch-depth: 1
      - name: Show Chaquopy version
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy"
          git log -1 --oneline
          git branch --show-current
      # ---------- 2. 环境确认 ----------
      - name: Check environment
        run: |
          python3 --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || echo "no preinstalled NDK"
      # ---------- 3. 选定 NDK ----------
      - name: Pick NDK version
        id: ndk
        run: |
          LATEST=$(ls -v "$ANDROID_HOME/ndk" 2>/dev/null | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "::error::runner 未预装 NDK"
            exit 1
          fi
          echo "ndk=$ANDROID_HOME/ndk/$LATEST" >> "$GITHUB_OUTPUT"
          echo "使用 NDK: $LATEST"
      # ---------- 4. 基础依赖 ----------
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache build-essential
      # ---------- 5. JDK 17 ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ---------- 6. Python 3.11 ----------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ---------- 7. build.py 单目标参数探测 ----------
      - name: Detect build.py single-target flags
        id: flags
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy/server/pip"
          python3 build.py --help 2>&1 | tee build_help.txt || true
          if grep -q -- "--python-version" build_help.txt; then
            PYFLAG="--python-version"; ABIFLAG="--abi"
          elif grep -qE "^  --python" build_help.txt; then
            PYFLAG="--python"; ABIFLAG="--abi"
          else
            PYFLAG=""; ABIFLAG=""
          fi
          echo "pyflag=$PYFLAG" >> "$GITHUB_OUTPUT"
          echo "abiflag=$ABIFLAG" >> "$GITHUB_OUTPUT"
          echo "探测结果: PYFLAG='$PYFLAG' ABIFLAG='$ABIFLAG'"
      # ---------- 8. 交叉编译 xgboost（仅 cp311 + arm64-v8a） ----------
      - name: Build xgboost wheel (cp311 + arm64-v8a only)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          cd "$GITHUB_WORKSPACE/chaquopy/server/pip"
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi
          VER="${{ inputs.xgboost_version }}"
          if [ -n "$VER" ]; then SPEC="xgboost==${VER}"; else SPEC="xgboost"; fi
          PYFLAG="${{ steps.flags.outputs.pyflag }}"
          ABIFLAG="${{ steps.flags.outputs.abiflag }}"
          if [ -n "$PYFLAG" ] && [ -n "$ABIFLAG" ]; then
            echo "单目标构建: ${SPEC} ${PYFLAG} 3.11 ${ABIFLAG} arm64-v8a"
            python3 build.py ${PYFLAG} 3.11 ${ABIFLAG} arm64-v8a "${SPEC}"
          else
            echo "::warning::build.py 未识别出单目标参数，回退全量构建（会较慢）"
            python3 build.py "${SPEC}"
          fi
      # ---------- 9. 挑出目标 wheel ----------
      - name: Collect target wheel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"
          WH=$(ls "$GITHUB_WORKSPACE/chaquopy/server/pip/wheelhouse/"xgboost-*cp311-cp311-android_24_arm64_v8a.whl 2>/dev/null | head -n1)
          if [ -z "$WH" ]; then
            echo "未找到 cp311/arm64-v8a wheel，全部产物："
            ls -lh "$GITHUB_WORKSPACE/chaquopy/server/pip/wheelhouse" 2>/dev/null || true
            exit 1
          fi
          cp -v "$WH" "$GITHUB_WORKSPACE/wheelhouse/"
          ls -lh "$GITHUB_WORKSPACE/wheelhouse"
      # ---------- 10. 上传产物 ----------
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-android-arm64-v8a-cp311
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # ---------- 11. 构建摘要 ----------
      - name: Build summary
        if: always()
        run: |
          {
            echo "### xgboost Android wheel 构建摘要（v5 仓库地址修正版）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 源码仓库 | chaquo/chaquopy@master |"
            echo "| 目标平台 | android_24_arm64_v8a |"
            echo "| Python | 3.11 (cp311) |"
            echo "| xgboost | ${{ inputs.xgboost_version || 'latest' }} |"
            echo ""
            echo "**全部产物：**"
            echo '```'
            ls -lh "$GITHUB_WORKSPACE/chaquopy/server/pip/wheelhouse" 2>/dev/null || echo "无产物"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
