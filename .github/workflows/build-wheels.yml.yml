name: Build xgboost & scikit-learn Wheels (Linux / Python 3.11)
# ============================================================
# 用途：在 Python 3.11 环境下，从源码构建 xgboost 与 scikit-learn
#      的 Linux x86_64 .whl 安装包，并上传为 GitHub Actions 产物。
#
# 触发方式：
#   1. 手动触发（workflow_dispatch）—— 推荐，可自定义版本号
#   2. push 到 main/master 分支且改动了本文件或 scripts/
#   3. 每周一 03:00 UTC 定时构建（默认注释，需要时取消注释）
# ============================================================
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python 版本（默认 3.11）'
        required: false
        default: '3.11'
        type: string
      xgboost_version:
        description: 'xgboost 版本（留空则取兼容目标 Python 的最新版）'
        required: false
        default: ''
        type: string
      sklearn_version:
        description: 'scikit-learn 版本（留空则取兼容目标 Python 的最新版）'
        required: false
        default: ''
        type: string
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-wheels.yml'
      - 'scripts/**'
  # schedule:
  #   - cron: '0 3 * * 1'
# 同一分支/同一输入只保留最新一次运行，避免重复占用构建资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.xgboost_version || 'latest' }}
  cancel-in-progress: true
# 最小权限原则：只需要读仓库内容
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
jobs:
  # ==========================================================
  # 单 Job：构建 Linux x86_64 的 scikit-learn 与 xgboost wheel
  # ==========================================================
  build:
    name: Build wheels on Linux (py${{ inputs.python_version || '3.11' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      # ---------- 1. 拉取代码 ----------
      - name: Checkout repository
        uses: actions/checkout@v4
      # ---------- 2. 安装 Python ----------
      # 注意：不启用 cache: 'pip'——该功能要求仓库存在
      # requirements.txt / pyproject.toml，否则会报错
      - name: Set up Python ${{ inputs.python_version || '3.11' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.11' }}
          allow-prereleases: false
      - name: Show Python & pip version
        run: |
          python --version
          python -m pip --version
      # ---------- 3. 升级构建工具链 ----------
      - name: Upgrade build toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade build
      # ---------- 4. Linux 系统级编译依赖 ----------
      # xgboost 需要 OpenMP 运行时（libgomp），scikit-learn 需要 BLAS/LAPACK
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libgomp1 \
            libopenblas-dev \
            liblapack-dev \
            gfortran \
            pkg-config
      # ---------- 5. 解析目标版本号 ----------
      - name: Resolve target versions
        id: versions
        shell: bash
        env:
          XGB_INPUT: ${{ inputs.xgboost_version }}
          SKL_INPUT: ${{ inputs.sklearn_version }}
          PY_VER: ${{ inputs.python_version || '3.11' }}
        run: |
          set -euo pipefail
          # --python：过滤掉要求更高 Python 版本的发布版（如 xgboost 3.4.x 要求 >=3.12）
          XGB_VER="${XGB_INPUT:-$(python scripts/resolve_version.py xgboost --python "${PY_VER}")}"
          SKL_VER="${SKL_INPUT:-$(python scripts/resolve_version.py scikit-learn --python "${PY_VER}")}"
          echo "xgboost=${XGB_VER}" >> "$GITHUB_OUTPUT"
          echo "scikit-learn=${SKL_VER}" >> "$GITHUB_OUTPUT"
          echo "解析结果 -> xgboost=${XGB_VER}, scikit-learn=${SKL_VER}"
      # ---------- 6. 从源码构建 scikit-learn wheel ----------
      - name: Build scikit-learn wheel
        shell: bash
        env:
          SKL_VER: ${{ steps.versions.outputs.scikit-learn }}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python -m pip wheel "scikit-learn==${SKL_VER}" \
            --no-deps \
            --no-build-isolation \
            --wheel-dir wheelhouse
          ls -lh wheelhouse
      # ---------- 7. 从源码构建 xgboost wheel ----------
      - name: Build xgboost wheel
        shell: bash
        env:
          XGB_VER: ${{ steps.versions.outputs.xgboost }}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python -m pip wheel "xgboost==${XGB_VER}" \
            --no-deps \
            --no-build-isolation \
            --wheel-dir wheelhouse
          ls -lh wheelhouse
      # ---------- 8. 校验产物 ----------
      - name: Verify wheels
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_wheels.py wheelhouse \
            --expect 2 \
            --python "${{ inputs.python_version || '3.11' }}"
      # ---------- 9. 冒烟测试：本地安装并 import ----------
      - name: Smoke test (install & import)
        shell: bash
        run: |
          set -euo pipefail
          # 自动解析 wheel 声明的依赖并安装，避免遗漏新增依赖（如 narwhals）
          python scripts/install_wheels.py wheelhouse
          python scripts/smoke_test.py
      # ---------- 10. 上传 wheel 产物 ----------
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-py${{ inputs.python_version || '3.11' }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0   # whl 本身已压缩，避免二次压缩浪费 CPU
      # ---------- 11. 打印构建摘要 ----------
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 构建摘要 — Linux x86_64 / py${{ inputs.python_version || '3.11' }}"
            echo ""
            echo "| 项目 | 版本 |"
            echo "| --- | --- |"
            echo "| xgboost | ${{ steps.versions.outputs.xgboost }} |"
            echo "| scikit-learn | ${{ steps.versions.outputs.scikit-learn }} |"
            echo ""
            echo "**产物列表：**"
            echo '```'
            ls -lh wheelhouse 2>/dev/null || echo "无产物"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
